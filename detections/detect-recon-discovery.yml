title: Comandos de Reconocimiento Local Detectados (Discovery)
id: ce828a17-4b0c-454e-a81d-eee44ee88725
status: experimental
    - https://github.com/GonzaloGaBa/soc-home-lab
tags:
    - attack.discovery
    - attack.t1033
    - attack.t1087.001
    - attack.t1057
logsource:
    product: windows
    service: sysmon
detection:
    selection_identity:
        EventID: 1
        Image|endswith: '\whoami.exe'
    selection_processes:
        EventID: 1
        Image|endswith: '\tasklist.exe'
    selection_accounts:
        EventID: 1
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|re: '(?i)\s+user\s*$'
    condition: selection_identity or selection_processes or selection_accounts
description: Identificación de ejecutables mediante el campo y, para la enumeración de cuentas, evaluación de argumentos mediante CommandLine. Cada evento se evalúa individualmente; no se correlacionan secuencias de comandos.
level: low

falsepositives:
    - Tareas legítimas de administración, soporte e inventario.
    - Scripts autorizados de auditoría.
    - Ejercicios de laboratorio y consultas interactivas del usuario.
